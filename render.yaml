services:
  - type: worker
    name: kb-geoid-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PROJ_NETWORK
        value: "true"
